<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCAMSHIELD X — THREAT CONSOLE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@400;600;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style id="cyber-styles">
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; background-color: #050505; }
      body { background-color: #050505; color: #ffffff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; line-height: 1.5; min-height: 100vh; overflow-x: hidden; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .text-cyan { color: #00E5FF; }
      .text-red { color: #FF2A2A; }
      .text-green { color: #00E676; }
      .text-amber { color: #FFB300; }
      .cyber-app-container { position: relative; min-height: 100vh; background-color: #050505; }
      .cyber-bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; }
      .console-container { position: relative; z-index: 10; max-width: 1440px; margin: 0 auto; padding: 24px; }
      .top-header { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 15, 15, 0.85); border: 1px solid #262626; backdrop-filter: blur(12px); padding: 16px 24px; margin-bottom: 24px; }
      .brand-title { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 800; letter-spacing: 2px; color: #ffffff; display: flex; align-items: center; gap: 8px; }
      .brand-icon { color: #00E5FF; font-size: 20px; }
      .brand-badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; background: #171717; color: #00E5FF; border: 1px solid #00E5FF; padding: 2px 8px; margin-left: 8px; letter-spacing: 1px; }
      .status-badge { display: flex; align-items: center; gap: 8px; background: #0F0F0F; border: 1px solid #262626; padding: 6px 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; }
      .dot-indicator { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
      .dot-active { background: #00E676; box-shadow: 0 0 8px #00E676; }
      .dot-offline { background: #737373; }
      .btn-outlined { background: #0F0F0F; color: #ffffff; border: 1px solid #262626; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; padding: 8px 14px; cursor: pointer; letter-spacing: 0.5px; transition: all 0.2s; }
      .btn-outlined:hover { border-color: #00E5FF; color: #00E5FF; }
      .btn-test { border-color: #00E5FF; color: #00E5FF; }
      .btn-action { background: #FF2A2A; color: #ffffff; border: none; font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 12px; padding: 12px 20px; cursor: pointer; letter-spacing: 1px; }
      .tactical-hud-row { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 24px; }
      .cyber-terminal-box { background: rgba(15, 15, 15, 0.85); border: 1px solid #262626; backdrop-filter: blur(12px); padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      .terminal-header { display: flex; justify-content: space-between; border-bottom: 1px solid #262626; padding-bottom: 8px; margin-bottom: 10px; color: #737373; font-size: 10px; font-weight: 700; }
      .terminal-body { display: flex; flex-direction: column; gap: 6px; color: #94A3B8; }
      .terminal-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .hud-card { position: relative; }
      .corner-tl, .corner-tr, .corner-bl, .corner-br { position: absolute; width: 8px; height: 8px; border-color: #00E5FF; border-style: solid; pointer-events: none; }
      .corner-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
      .corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
      .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
      .corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
      .metrics-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
      .metric-card { background: rgba(15, 15, 15, 0.85); border: 1px solid #262626; backdrop-filter: blur(12px); padding: 20px; }
      .metric-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #737373; letter-spacing: 1px; margin-bottom: 8px; }
      .metric-value { font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 900; }
      .dashboard-grid { display: grid; grid-template-columns: 1fr 380px; gap: 24px; }
      .threat-card { background: rgba(15, 15, 15, 0.85); border: 1px solid #262626; backdrop-filter: blur(12px); padding: 24px; }
      .threat-card.critical { border-color: #FF2A2A; }
      .threat-card.suspicious { border-color: #FFB300; }
      .threat-card.low { border-color: #00E676; }
      .card-header-label { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 800; color: #00E5FF; border-bottom: 1px solid #262626; padding-bottom: 12px; margin-bottom: 16px; }
      .threat-headline { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 900; margin-bottom: 20px; }
      .threat-headline.critical { color: #FF2A2A; }
      .threat-headline.suspicious { color: #FFB300; }
      .threat-headline.low { color: #00E676; }
      .score-meta-grid { display: grid; grid-template-columns: 140px 1fr; gap: 20px; background: #0F0F0F; border: 1px solid #262626; padding: 20px; margin-bottom: 20px; }
      .score-box { display: flex; flex-direction: column; justify-content: center; align-items: center; border-right: 1px solid #262626; padding-right: 16px; }
      .score-num { font-family: 'JetBrains Mono', monospace; font-size: 44px; font-weight: 900; line-height: 1; }
      .score-denom { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #737373; margin-top: 6px; }
      .meta-details { display: flex; flex-direction: column; gap: 8px; }
      .meta-row { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      .meta-key { color: #737373; }
      .meta-val { color: #ffffff; font-weight: 700; }
      .threat-chain-container { background: #0F0F0F; border: 1px solid #262626; padding: 16px; margin-top: 16px; }
      .chain-flow { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
      .chain-node { background: #171717; border: 1px solid #262626; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #ffffff; }
      .chain-node.terminal { border-color: #FF2A2A; color: #FF2A2A; background: rgba(255, 42, 42, 0.1); }
      .chain-arrow { text-align: center; color: #00E5FF; font-size: 12px; font-weight: bold; }
      .signals-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
      .signal-item { background: rgba(255, 42, 42, 0.08); border: 1px solid #FF2A2A; color: #FF2A2A; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; padding: 8px 12px; }
      .timeline-panel { background: rgba(15, 15, 15, 0.85); border: 1px solid #262626; backdrop-filter: blur(12px); padding: 20px; }
      .timeline-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; max-height: 600px; overflow-y: auto; }
      .timeline-item { background: #0F0F0F; border: 1px solid #262626; padding: 14px; cursor: pointer; transition: all 0.2s; }
      .timeline-item:hover, .timeline-item.active { border-color: #00E5FF; background: #171717; }
      .timeline-top { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 800; margin-bottom: 6px; }
      .timeline-cat { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 800; color: #ffffff; }
      .empty-state { background: rgba(15, 15, 15, 0.85); border: 1px solid #262626; backdrop-filter: blur(12px); padding: 40px; text-align: center; }
      .empty-title { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 800; color: #00E5FF; margin-bottom: 8px; }
      .empty-sub { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #737373; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
